<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Cartoon bouquet of atasi, chempaka, punnaga, ashoka and sougandhika flowers">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#f4f7f2"/>
      <stop offset="100%" stop-color="#dfe7df"/>
    </radialGradient>

    <!-- Atasi (flax) — blue 5-petal star -->
    <g id="atasi">
      <g fill="#5b8dd9" stroke="#3f6fb8" stroke-width="1.4">
        <ellipse id="ap" cx="0" cy="-14" rx="8" ry="13"/>
        <use href="#ap" transform="rotate(72)"/>
        <use href="#ap" transform="rotate(144)"/>
        <use href="#ap" transform="rotate(216)"/>
        <use href="#ap" transform="rotate(288)"/>
      </g>
      <circle r="4.5" fill="#f4d35e"/>
    </g>

    <!-- Chempaka (champak) — golden slender pointed petals -->
    <g id="chempaka">
      <g fill="#f7b32b" stroke="#e0921a" stroke-width="1.3">
        <path id="cp" d="M0 4 C 7 -10, 5 -26, 0 -30 C -5 -26, -7 -10, 0 4 Z"/>
        <use href="#cp" transform="rotate(60)"/>
        <use href="#cp" transform="rotate(120)"/>
        <use href="#cp" transform="rotate(180)"/>
        <use href="#cp" transform="rotate(240)"/>
        <use href="#cp" transform="rotate(300)"/>
      </g>
      <circle r="4" fill="#e0921a"/>
    </g>

    <!-- Punnaga — white rounded petals, yellow center -->
    <g id="punnaga">
      <g fill="#ffffff" stroke="#d9cdb8" stroke-width="1.4">
        <circle id="pp" cx="0" cy="-12" r="9"/>
        <use href="#pp" transform="rotate(72)"/>
        <use href="#pp" transform="rotate(144)"/>
        <use href="#pp" transform="rotate(216)"/>
        <use href="#pp" transform="rotate(288)"/>
      </g>
      <circle r="6" fill="#f6c945"/>
      <circle r="6" fill="none" stroke="#e0a91c" stroke-width="1"/>
    </g>

    <!-- Ashoka — orange-red rounded cluster bloom -->
    <g id="ashoka">
      <g fill="#f26430" stroke="#c9481f" stroke-width="1.2">
        <circle cx="-7" cy="-4" r="7"/>
        <circle cx="7" cy="-4" r="7"/>
        <circle cx="0" cy="-11" r="7"/>
        <circle cx="-4" cy="5" r="6.5"/>
        <circle cx="6" cy="5" r="6.5"/>
      </g>
      <g fill="#ffd24d" stroke="#e8a61c" stroke-width="0.8">
        <circle cx="-7" cy="-4" r="2"/>
        <circle cx="7" cy="-4" r="2"/>
        <circle cx="0" cy="-11" r="2"/>
      </g>
    </g>

    <!-- Sougandhika — pink water-lily / lotus bloom -->
    <g id="sougandhika">
      <g fill="#ec6f9e" stroke="#cf4f80" stroke-width="1.3">
        <path id="sp" d="M0 6 C 9 -8, 7 -26, 0 -32 C -7 -26, -9 -8, 0 6 Z"/>
        <use href="#sp" transform="rotate(45)"/>
        <use href="#sp" transform="rotate(90)"/>
        <use href="#sp" transform="rotate(135)"/>
        <use href="#sp" transform="rotate(180)"/>
        <use href="#sp" transform="rotate(225)"/>
        <use href="#sp" transform="rotate(270)"/>
        <use href="#sp" transform="rotate(315)"/>
      </g>
      <g fill="#f7b6cf" stroke="#e389ac" stroke-width="1">
        <path d="M0 3 C 5 -5, 4 -15, 0 -18 C -4 -15, -5 -5, 0 3 Z"/>
        <path d="M0 3 C 5 -5, 4 -15, 0 -18 C -4 -15, -5 -5, 0 3 Z" transform="rotate(90)"/>
        <path d="M0 3 C 5 -5, 4 -15, 0 -18 C -4 -15, -5 -5, 0 3 Z" transform="rotate(45)"/>
        <path d="M0 3 C 5 -5, 4 -15, 0 -18 C -4 -15, -5 -5, 0 3 Z" transform="rotate(135)"/>
      </g>
      <circle r="4" fill="#f4d35e"/>
    </g>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- stems -->
  <g stroke="#3f8a4b" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M100 150 C 70 120, 62 96, 60 74"/>
    <path d="M100 150 C 84 118, 82 96, 82 78"/>
    <path d="M100 150 C 100 120, 100 100, 100 72"/>
    <path d="M100 150 C 116 118, 120 96, 122 76"/>
    <path d="M100 150 C 132 122, 140 98, 142 78"/>
  </g>
  <!-- leaves -->
  <g fill="#4ca35c">
    <path d="M100 132 C 84 128, 74 116, 72 104 C 88 108, 98 120, 100 132 Z"/>
    <path d="M100 132 C 116 128, 126 116, 128 104 C 112 108, 102 120, 100 132 Z"/>
  </g>

  <!-- blooms -->
  <use href="#sougandhika" transform="translate(100 66)"/>
  <use href="#punnaga" transform="translate(60 70) scale(0.9)"/>
  <use href="#chempaka" transform="translate(142 72) scale(0.95)"/>
  <use href="#atasi" transform="translate(80 76) scale(0.9)"/>
  <use href="#ashoka" transform="translate(122 74) scale(0.95)"/>

  <!-- wrap / tie -->
  <path d="M100 150 L82 190 L118 190 Z" fill="#c9a36b" stroke="#a9854f" stroke-width="1.5"/>
  <rect x="90" y="146" width="20" height="9" rx="3" fill="#8c6239"/>
</svg>
